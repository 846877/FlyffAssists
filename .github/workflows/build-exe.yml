name: Build FlyffAssist.exe

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        run: python -m pytest -q tests
      - name: Construire l'exe
        run: pyinstaller --onefile --windowed --name FlyffAssist --hidden-import win32timezone run.py
      - uses: actions/upload-artifact@v4
        with:
          name: FlyffAssist
          path: dist/FlyffAssist.exe
      - name: Publier la release « latest »
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest dist/FlyffAssist.exe --target "${{ github.sha }}" \
            --prerelease --title "FlyffAssist (dernière version)" \
            --notes "Construit automatiquement depuis ${{ github.ref_name }} (${{ github.sha }})."
